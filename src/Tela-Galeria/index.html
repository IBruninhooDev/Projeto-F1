<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Galeria F1</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/src/Tela-Galeria/style.css" />

    <!-- ICON -->
    <link rel="icon" href="/src/img/ICON-F1.png" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header fade-down">
      <nav class="navbar">
        <!-- LOGO -->
        <a href="#" class="logo zoom"> F1<span>DEV</span> </a>

        <!-- MENU -->
        <ul class="nav-links">
          <li class="fade-up">
            <a href="/index.html"> Início </a>
          </li>

          <li class="fade-up">
            <a href="/src/Tela-Galeria/index.html" class="active"> Galeria </a>
          </li>

          <li class="fade-up">
            <a href="/src/Tela-Pilotos/index.html"> Pilotos </a>
          </li>
        </ul>

        <!-- MENU HAMBURGUER -->
        <div class="hamburger zoom">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </nav>
    </header>

    <!-- HERO -->
    <section class="hero">
      <!-- OVERLAY -->
      <div class="overlay"></div>

      <!-- EFEITOS -->
      <div class="lines"></div>

      <div class="light"></div>

      <div class="particles"></div>

      <!-- CONTEÚDO -->
      <div class="hero-content fade-up">
        <span class="tag zoom"> 🏎️ SCUDERIA FERRARI </span>

        <h1 class="fade-left">
          Hamilton &<br />
          Charles Leclerc
        </h1>

        <p class="fade-right">
          Explore a nova era da Ferrari na Fórmula 1 com dois dos maiores
          pilotos do grid.
        </p>
      </div>
    </section>

    <!-- GALERIA -->
    <section class="galeria fade-up">
      <div class="container">
        <!-- TITULO -->
        <div class="section-title fade-up">
          <span class="zoom"> FERRARI DRIVERS </span>

          <h2 class="fade-left">Pilotos da Temporada</h2>
        </div>

        <!-- GRID -->
        <div class="gallery-grid">
          <!-- HAMILTON -->
          <div class="gallery-card fade-left zoom">
            <img
              src="https://images.openai.com/static-rsc-4/Yy5H0zuO_3suDu_kB1JSSpm5XQO9j5ADA1dKMeV8CRUJE5Nx3XlpKswr6_Idqy-h-da0bVSn80nx5nwzyAbIBHJkbHwsCx-7UEhZnRtIjo-vqqwG7laDQN2hAv9dJofoCx5w21P_c1EUvlUp-ykAMoT0It22Y8_rlKdDATh7kIBH82d1BtE32dQRyXzFXHUX?purpose=fullsize"
              alt="Lewis Hamilton"
              class="zoom"
            />

            <div class="gallery-info fade-up">
              <span> #44 </span>

              <h3>Lewis Hamilton</h3>
            </div>
          </div>

          <!-- LECLERC -->
          <div class="gallery-card fade-right zoom">
            <img
              src="https://images.openai.com/static-rsc-4/nasUz2eQlaOimkBSf0QfQQGKLdAvHZb-MWpGPar-9GzpUD5-ISQiiB4aB5GfijYn7Bz4_wcWZRl1oh49T3jeCoAskwedlvs7FwmEXuu8MFQZCzAkSeo76wWWeJi_qNxge33dGyQWVZEwfD4YlhTpfMHEVtPYpnNMphK6gt_CDSwGPQqPOcHOkwhTW_y1iM5u?purpose=fullsize"
              alt="Charles Leclerc"
              class="zoom"
            />

            <div class="gallery-info fade-up">
              <span> #16 </span>

              <h3>Charles Leclerc</h3>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- JS -->
    <script src="/src/js/menu.js"></script>
    <script src="/src/js/contador.js"></script>
    <script src="/src/js/efeito3d.js"></script>
    <script src="/src/js/efeito.js  "></script>
  </body>
</html>
